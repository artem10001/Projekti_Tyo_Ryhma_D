<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Valmiit pitsat - Pizzeria Fantasia</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f2f2f2; }
header { background: darkred; color: white; padding: 20px; text-align: center; }
.menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px; }
.pizza { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
button { background: darkred; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
button:hover { background: red; }
.back-button { text-align: center; margin-top: 20px; }
.back-button button { background-color: darkred; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
.back-button button:hover { background-color: red; }
.toppings { text-align: left; margin-bottom: 10px; }
</style>
</head>
<body>

<header><h1>Valmiit pitsat</h1></header>

<div class="menu" id="menu"></div>

<div class="back-button">
    <a href="index.html"><button>Takaisin pääsivulle</button></a>
</div>

<script>
const pizzat = [
  ["Margherita",10],["Pepperoni",11],["Kebab",12],["Hawaii",11],
  ["Tonnikala",11.5],["Pollo",10],["Mexicana",10.5],["Opera",11],
  ["Capricciosa",12],["Pizzatown Special",14],["BBQ Kana",12.5],["Kasvis",9],
  ["Americana",11.5],["Salami",11],["Kinkku-Ananas",10],["Tuplajuusto",10]
];

const toppings = [
  ["Extra juusto",1.0],["Pepperoni",1.5],["Kebab",1.5],
  ["Paprika",0.5],["Sieni",0.5],["Ananas",0.7],["Tonnikala",1.2]
];

let selectedToppings = {};
const menu = document.getElementById("menu");

pizzat.forEach((pizza, index) => {
  let toppingsOptions = toppings.map((topping, tIndex) =>
    `<label><input type="checkbox" data-pizza="${index}" data-topping="${tIndex}" onchange="updateTopping(this)">
    ${topping[0]} (+${topping[1]} €)</label><br>`
  ).join("");
  menu.innerHTML += `
  <div class="pizza">
    <h3>${pizza[0]}</h3>
    <p>${pizza[1]} €</p>
    <div class="toppings">${toppingsOptions}</div>
    <button onclick="addToCart(${index})">Lisää</button>
  </div>`;
});

function updateTopping(checkbox){
  const pizzaIndex = parseInt(checkbox.dataset.pizza);
  const toppingIndex = parseInt(checkbox.dataset.topping);
  if(!selectedToppings[pizzaIndex]) selectedToppings[pizzaIndex] = [];
  if(checkbox.checked){
    selectedToppings[pizzaIndex].push(toppingIndex);
  } else {
    selectedToppings[pizzaIndex] = selectedToppings[pizzaIndex].filter(i => i !== toppingIndex);
  }
}

function addToCart(index){
  const pizza = pizzat[index];
  let toppingsText = "";
  let toppingsTotal = 0;
  if(selectedToppings[index] && selectedToppings[index].length > 0){
    toppingsText = selectedToppings[index].map(tIndex => {
      toppingsTotal += toppings[tIndex][1];
      return toppings[tIndex][0];
    }).join(", ");
  }
  const price = pizza[1] + toppingsTotal;
  const details = toppingsText ? "Lisätäytteet: " + toppingsText : "";
  Cart.addItem(pizza[0], price, details);
  if(selectedToppings[index]){
    selectedToppings[index].forEach(tIndex => {
      document.querySelector(`input[data-pizza="${index}"][data-topping="${tIndex}"]`).checked = false;
    });
  }
  selectedToppings[index] = [];
}
</script>
<script src="cart.js"></script>
</body>
</html>
