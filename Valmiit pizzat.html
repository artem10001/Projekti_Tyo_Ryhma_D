<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valmiit pizzat — PizzaTown</title>
<link rel="stylesheet" href="visuals.css">
<style>
.menu {
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 24px 60px;
}
</style>
</head>
<body>

<header class="top-logo">
    <img src="Images/Pizza logo.png" alt="PizzaTown logo">
    <h1>PizzaTown</h1>
    <p class="slogan">Tuoretta pizzaa joka päivä</p>
</header>

<nav class="navbar">
    <a href="index.html">Etusivu</a>
    <a href="Valmiit pizzat.html">Valmiit pizzat</a>
    <a href="oma.html">Luo oma pizza</a>
    <a href="klassikot.html">Klassikot</a>
    <div id="login_container">
        <button id="login_toggle_btn" onclick="toggleLoginPanel()">Kirjaudu sisään</button>
        <div id="login_panel">
            <h3>Kirjaudu sisään</h3>
            <div id="login_fields">
                <input id="nimi" type="text" placeholder="Käyttäjänimi" />
                <input id="salasana" type="password" placeholder="Salasana" />
                <button class="btn-login" onclick="login()">Kirjaudu sisään</button>
                <div id="panel_message" class="panel-message"></div>
                <hr class="panel-divider">
                <div class="register-section">
                    <p>Ei vielä tiliä?</p>
                    <button class="btn-register" onclick="rekisteröidy()">Rekisteröidy</button>
                </div>
            </div>
            <div id="logout_section">
                <p>Olet kirjautunut sisään, <strong id="logged_in_name"></strong>!</p>
                <button class="btn-logout" onclick="logout()">Kirjaudu ulos</button>
            </div>
        </div>
    </div>
</nav>

<h1 class="page-title">Valmiit pizzat</h1>
<p class="page-subtitle">Klassisia makuja - valitse ja nauti</p>

<div class="menu" id="menu"></div>

<div class="back-button">
    <a href="index.html"><button>← Etusivulle</button></a>
</div>

<script src="cart.js"></script>
<script src="scripts.js"></script>
<script>
const pizzat = [
    ["Margherita",10],["Pepperoni",11],["Kebab",12],["Hawaii",11],
    ["Tonnikala",11.5],["Pollo",10],["Mexicana",10.5],["Opera",11],
    ["Capricciosa",12],["Pizzatown Special",14],["BBQ Kana",12.5],["Kasvis",9],
    ["Americana",11.5],["Salami",11],["Kinkku-Ananas",10],["Tuplajuusto",10]
];
const toppings = [
    ["Extra juusto",1.0],["Pepperoni",1.5],["Kebab",1.5],
    ["Paprika",0.5],["Sieni",0.5],["Ananas",0.7],["Tonnikala",1.2]
];
let selectedToppings = {};
const menu = document.getElementById("menu");

pizzat.forEach((pizza, index) => {
    let toppingsOptions = toppings.map((topping, tIndex) =>
        `<label><input type="checkbox" data-pizza="${index}" data-topping="${tIndex}" onchange="updateTopping(this)">
        ${topping[0]} <em style="color:var(--red);font-style:normal;">+${topping[1]}€</em></label>`
    ).join("");
    menu.innerHTML += `
    <div class="pizza">
        <h3>${pizza[0]}</h3>
        <p><strong>${pizza[1].toFixed(2)} €</strong></p>
        <div class="toppings">${toppingsOptions}</div>
        <button onclick="addToCart(${index})">Lisää koriin</button>
    </div>`;
});

function updateTopping(checkbox){
    const pi = parseInt(checkbox.dataset.pizza), ti = parseInt(checkbox.dataset.topping);
    if(!selectedToppings[pi]) selectedToppings[pi] = [];
    checkbox.checked ? selectedToppings[pi].push(ti) : (selectedToppings[pi] = selectedToppings[pi].filter(i=>i!==ti));
}

function addToCart(index){
    const pizza = pizzat[index];
    let text = "", total = 0;
    if(selectedToppings[index]?.length){
        text = selectedToppings[index].map(ti=>{ total+=toppings[ti][1]; return toppings[ti][0]; }).join(", ");
    }
    Cart.addItem(pizza[0], pizza[1]+total, text ? "Lisätäytteet: "+text : "");
    selectedToppings[index]?.forEach(ti=>{ document.querySelector(`input[data-pizza="${index}"][data-topping="${ti}"]`).checked=false; });
    selectedToppings[index]=[];
}
</script>
</body>
</html>
