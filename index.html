<!DOCTYPE html>
<html lang="fi">

<head>
<meta charset="UTF-8">
<title>PizzaTown</title>
<link rel="stylesheet" href="visuals.css">

<style>
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.modal-content{
    background:white;
    width:320px;
    margin:150px auto;
    padding:20px;
    border-radius:10px;
    text-align:center;
}
</style>

</head>

<body>

<header class="top-logo">
<img src="Images/Pizza logo.png">
<h1>PizzaTown</h1>
<p class="slogan">Tuoretta pizzaa joka päivä</p>
</header>

<nav class="navbar">
<a href="index.html">Etusivu</a>
<a href="Valmiit pizzat.html">Valmiit pizzat</a>
<a href="oma.html">Luo oma pizza</a>
<a href="klassikot.html">Klassikot</a>
</nav>


<div style="text-align:center; margin:20px;">
<button onclick="openDrinks()">🥤 Tilaa juomia</button>
</div>


<div id="drinkPopup" class="modal">
<div class="modal-content">
<h3>Valitse juomat</h3>

<button onclick="addDrink('Coca-Cola', 3)">Coca-Cola 3€</button><br><br>
<button onclick="addDrink('Coca-Cola Zero', 3)">Coca-Cola Zero 3€</button><br><br>
<button onclick="addDrink('Fanta', 3)">Fanta 3€</button><br><br>
<button onclick="addDrink('Sprite', 3)">Sprite 3€</button><br><br>

<button onclick="closeDrinks()">Sulje</button>
</div>
</div>

<main>
<section class="welcome">
<h2>Tervetuloa!</h2>
<p>
Valitse valmis pizza klassikkolistalta
tai tee oma Fantasia-pizza juuri
sinun haluamillasi täytteillä.
</p>
</section>

<section class="menu-section">
<h2>MIKÄ MAISTUISI TÄNÄÄN?</h2>

<div class="pizza-grid">

<a href="Valmiit pizzat.html" class="pizza-card">
<img src="Images/Valmiit pizzat.jpg">
<h3>Valmiit pizzat</h3>
</a>

<a href="oma.html" class="pizza-card">
<img src="Images/Luo oma.jpg">
<h3>Luo oma pizza</h3>
</a>

<a href="klassikot.html" class="pizza-card">
<img src="Images/lataa 11.jpg">
<h3>Klassikot</h3>
</a>

</div>
</section>
</main>

<script>

function openDrinks(){
    document.getElementById("drinkPopup").style.display = "block";
}

function closeDrinks(){
    document.getElementById("drinkPopup").style.display = "none";
}

function addDrink(name, price){
    alert(name + " lisätty tilaukseen! Hinta: " + price + "€");
    closeDrinks();
}
</script>

</body>
</html>
