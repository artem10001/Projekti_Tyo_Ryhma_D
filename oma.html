<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luo oma pizza - PizzaTown</title>
<link rel="stylesheet" href="visuals.css">
</head>
<body>

<header class="top-logo">
    <img src="Images/Pizza logo.png" alt="PizzaTown logo">
    <h1>PizzaTown</h1>
    <p class="slogan">Tuoretta pizzaa joka päivä</p>
</header>

<nav class="navbar">
    <a href="index.html">Etusivu</a>
    <a href="Valmiit pizzat.html">Valmiit pizzat</a>
    <a href="oma.html">Luo oma pizza</a>
    <a href="klassikot.html">Klassikot</a>
    <div id="login_container">
        <button id="login_toggle_btn" onclick="toggleLoginPanel()">Kirjaudu sisään</button>
        <div id="login_panel">
            <h3>Kirjaudu sisään</h3>
            <div id="login_fields">
                <input id="nimi" type="text" placeholder="Käyttäjänimi" />
                <input id="salasana" type="password" placeholder="Salasana" />
                <button class="btn-login" onclick="login()">Kirjaudu sisään</button>
                <div id="panel_message" class="panel-message"></div>
                <hr class="panel-divider">
                <div class="register-section">
                    <p>Ei vielä tiliä?</p>
                    <button class="btn-register" onclick="rekisteröidy()">Rekisteröidy</button>
                </div>
            </div>
            <div id="logout_section">
                <p>Olet kirjautunut sisään, <strong id="logged_in_name"></strong>!</p>
                <button class="btn-logout" onclick="logout()">Kirjaudu ulos</button>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <h2>Luo Fantasia-pizza</h2>

    <h3>Pohja</h3>
    <label><input type="radio" name="pohja" value="Normaali" data-price="0" checked> Normaali</label>
    <label><input type="radio" name="pohja" value="Gluteeniton" data-price="1.5"> Gluteeniton <em style="color:var(--red);font-style:normal;">+1.50 €</em></label>

    <h3>Kastike</h3>
    <label><input type="radio" name="kastike" value="Tomaatti" data-price="0" checked> Tomaattikastike</label>
    <label><input type="radio" name="kastike" value="Tomaatti + valkosipuli" data-price="0.5"> Tomaatti + valkosipuli <em style="color:var(--red);font-style:normal;">+0.50 €</em></label>

    <h3>Täytteet (valitse 3–5)</h3>
    <label><input type="checkbox" name="tayte" data-price="1.5" value="Kinkku"> Kinkku <em style="color:var(--red);font-style:normal;">+1.50 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="1.5" value="Pepperoni"> Pepperoni <em style="color:var(--red);font-style:normal;">+1.50 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="1.5" value="Kana"> Kana <em style="color:var(--red);font-style:normal;">+1.50 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="2.5" value="Parmankinkku"> Parmankinkku <em style="color:var(--red);font-style:normal;">+2.50 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="1.0" value="Ananas"> Ananas <em style="color:var(--red);font-style:normal;">+1.00 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="1.0" value="Sienet"> Sienet <em style="color:var(--red);font-style:normal;">+1.00 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="1.0" value="Oliivit"> Oliivit <em style="color:var(--red);font-style:normal;">+1.00 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="1.0" value="Punasipuli"> Punasipuli <em style="color:var(--red);font-style:normal;">+1.00 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="2.0" value="Aurajuusto"> Aurajuusto <em style="color:var(--red);font-style:normal;">+2.00 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="1.0" value="Jalapeño"> Jalapeño <em style="color:var(--red);font-style:normal;">+1.00 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="1.5" value="Kebab"> Kebab <em style="color:var(--red);font-style:normal;">+1.50 €</em></label>
    <label><input type="checkbox" name="tayte" data-price="1.5" value="Jauheliha"> Jauheliha <em style="color:var(--red);font-style:normal;">+1.50 €</em></label>
    <div class="error" id="error"></div>

    <h3>Juusto</h3>
    <label><input type="radio" name="juusto" value="Mozzarella" data-price="0" checked> Mozzarella</label>
    <label><input type="radio" name="juusto" value="Buffalomozzarella" data-price="2.0"> Buffalomozzarella <em style="color:var(--red);font-style:normal;">+2.00 €</em></label>

    <div class="total">Hinta: <span id="totalPrice">9.00</span> €</div>

    <button onclick="hyvaksyPizza()">Lisää ostoskoriin</button>
    <p id="vahvistus"></p>
</div>

<div class="back" style="padding-bottom:60px;">
    <a href="index.html">← Takaisin etusivulle</a>
</div>

<script src="cart.js"></script>
<script src="scripts.js"></script>
<script>
const basePrice = 9;

function calculatePrice(){
    let total = basePrice;
    document.querySelectorAll('input[name="pohja"]:checked, input[name="kastike"]:checked, input[name="juusto"]:checked').forEach(el => {
        if(el.dataset.price) total += Number(el.dataset.price);
    });
    document.querySelectorAll('input[name="tayte"]:checked').forEach(el => {
        if(el.dataset.price) total += Number(el.dataset.price);
    });
    document.getElementById("totalPrice").textContent = total.toFixed(2);
}

document.querySelectorAll('input[name="tayte"]').forEach(el => el.addEventListener("change", checkToppings));
document.querySelectorAll('input[type="radio"]').forEach(el => el.addEventListener("change", calculatePrice));

function checkToppings(){
    const checked = document.querySelectorAll('input[name="tayte"]:checked');
    if(checked.length > 5){
        this.checked = false;
        document.getElementById("error").textContent = "Voit valita enintään 5 täytettä.";
    } else {
        document.getElementById("error").textContent = "";
    }
    calculatePrice();
}

function hyvaksyPizza(){
    const toppings = document.querySelectorAll('input[name="tayte"]:checked');
    if(toppings.length < 3 || toppings.length > 5){
        document.getElementById("error").textContent = "Valitse 3–5 täytettä.";
        return;
    }
    document.getElementById("error").textContent = "";

    const pohja   = document.querySelector('input[name="pohja"]:checked').value;
    const kastike = document.querySelector('input[name="kastike"]:checked').value;
    const juusto  = document.querySelector('input[name="juusto"]:checked').value;
    const lista   = [...toppings].map(t => t.value);
    const price   = parseFloat(document.getElementById("totalPrice").textContent);

    const details = `Pohja: ${pohja} | Kastike: ${kastike} | Juusto: ${juusto} | Täytteet: ${lista.join(", ")}`;
    Cart.addItem("Fantasia-pizza", price, details);
    document.getElementById("vahvistus").textContent = "✓ Lisätty ostoskoriin!";
}
</script>
</body>
</html>
