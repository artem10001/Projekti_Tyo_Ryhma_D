<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Klassikot - PizzaTown</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.pizza{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.pizza img{
width:100%;
border-radius:10px;
}

.toppings{
text-align:left;
margin:10px 0;
}

button{
background:#b22222;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:red;
}

.cart-global{
position:absolute;
left:20px;
top:120px;
width:260px;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.cart-global ul{
padding-left:18px;
}

.cart-global button{
margin-top:5px;
margin-left:4px;
}

.back{
text-align:center;
margin-top:30px;
}

a{
text-decoration:none;
color:#b22222;
font-weight:bold;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

.modal-content{
background:white;
width:320px;
margin:150px auto;
padding:20px;
border-radius:10px;
text-align:center;
}

</style>
</head>

<body>

<h1>🍕 Klassikot</h1>

<div class="menu" id="menu"></div>




<div class="cart-global">

<h3>🛒 Ostoskori</h3>

<ul id="cartList"></ul>

<p><strong>Yhteensä: <span id="cartTotal">0</span> €</strong></p>

<button onclick="openOrder()">Vahvista tilaus</button>

</div>



<div id="orderPopup" class="modal">

<div class="modal-content">

<h3>Vahvista tilaus</h3>

<input type="text" id="customerName" placeholder="Nimi"><br><br>

<input type="text" id="customerAddress" placeholder="Osoite"><br><br>

<label>
<input type="radio" name="deliveryType" value="nouto" checked>
Nouto
</label>

<label>
<input type="radio" name="deliveryType" value="kuljetus">
Kuljetus
</label>

<br><br>

<button onclick="confirmOrder()">Tilaa</button>

<p id="orderStatus"></p>

</div>
</div>


<div class="back">
<a href="index.html">⬅ Takaisin etusivulle</a>
</div>


<script>

const pizzat=[
["Lihamestari",14.9,"Images/Lihamestari.jpg","Kinkku, paahdettu pekoni, kebabliha, pepperonimakkara, naudanjauheliha"],
["Opera Special",13.2,"Images/Opera special.jpg","Tonnikala, kinkku, salami"],
["Americana",12.4,"Images/Americana.jpg","Kinkku, ananas, aura-sinihomejuusto"]
];

const toppings=[
["Extra juusto",1.0],
["Pepperoni",1.5],
["Kebab",1.5],
["Paprika",0.5],
["Sieni",0.5],
["Ananas",0.7],
["Tonnikala",1.2]
];

let cart=JSON.parse(localStorage.getItem("cart"))||[];
let selectedToppings={};

let cookingTime=0;
let timer;

const menu=document.getElementById("menu");


pizzat.forEach((pizza,index)=>{

let toppingsOptions=toppings.map((topping,tIndex)=>

`<label>
<input type="checkbox" data-pizza="${index}" data-topping="${tIndex}" onchange="updateTopping(this)">
${topping[0]} (+${topping[1]} €)
</label><br>`

).join("");

menu.innerHTML+=`

<div class="pizza">

<h2>${pizza[0]}</h2>

<img src="${pizza[2]}" alt="${pizza[0]}">

<p>${pizza[3]}</p>

<p><strong>${pizza[1].toFixed(2)} €</strong></p>

<div class="toppings">
${toppingsOptions}
</div>

<button onclick="addPizza(${index})">
Lisää ostoskoriin
</button>

</div>

`;

});


function updateTopping(checkbox){

const pizzaIndex=parseInt(checkbox.dataset.pizza);
const toppingIndex=parseInt(checkbox.dataset.topping);

if(!selectedToppings[pizzaIndex]) selectedToppings[pizzaIndex]=[];

if(checkbox.checked){
selectedToppings[pizzaIndex].push(toppingIndex);
}else{
selectedToppings[pizzaIndex]=selectedToppings[pizzaIndex].filter(i=>i!==toppingIndex);
}

}


function addPizza(index){

const pizza=pizzat[index];

let toppingsText=[];
let toppingsTotal=0;

(selectedToppings[index]||[]).forEach(tIndex=>{
toppingsText.push(toppings[tIndex][0]);
toppingsTotal+=toppings[tIndex][1];
});

const itemName=pizza[0]+(toppingsText.length? " + "+toppingsText.join(", "):"");
const itemPrice=pizza[1]+toppingsTotal;

const existing=cart.find(item=>item.name===itemName);

if(existing){
existing.qty++;
}else{
cart.push({name:itemName,price:itemPrice,qty:1});
}

saveCart();

selectedToppings[index]=[];

document.querySelectorAll(`input[data-pizza="${index}"]`).forEach(el=>el.checked=false);

}


function changeQty(i,amount){

cart[i].qty+=amount;

if(cart[i].qty<=0){
cart.splice(i,1);
}

saveCart();

}


function removeItem(i){

cart.splice(i,1);

saveCart();

}


function saveCart(){

localStorage.setItem("cart",JSON.stringify(cart));

updateCart();

}


function updateCart(){

const list=document.getElementById("cartList");
const totalSpan=document.getElementById("cartTotal");

list.innerHTML="";

let total=0;

cart.forEach((item,i)=>{

total+=item.price*item.qty;

list.innerHTML+=`

<li>

${item.name} (${item.qty})

<button onclick="changeQty(${i},1)">+</button>
<button onclick="changeQty(${i},-1)">−</button>
<button onclick="removeItem(${i})">Poista</button>

</li>

`;

});

totalSpan.textContent=total.toFixed(2);

}


function openOrder(){

if(cart.length===0){

alert("Ostoskori on tyhjä!");

return;

}

document.getElementById("orderPopup").style.display="block";

}


function confirmOrder(){

let name=document.getElementById("customerName").value;
let address=document.getElementById("customerAddress").value;

if(!name||!address){

alert("Täytä kaikki tiedot!");

return;

}

calculateCookingTime();

startTimer();

}


function calculateCookingTime(){

cookingTime=5;

cart.forEach(item=>{

cookingTime+=2*item.qty;

if(item.name.includes("+")){

let toppings=item.name.split("+")[1].split(",");

cookingTime+=toppings.length;

}

});

}


function startTimer(){

const status=document.getElementById("orderStatus");

timer=setInterval(()=>{

if(cookingTime<=0){

clearInterval(timer);

status.innerHTML="🍕 Pizza valmis!";

cart=[];
saveCart();

return;

}

status.innerHTML="Valmistusaika jäljellä: "+cookingTime+" min";

cookingTime--;

},1000);

}

updateCart();

</script>

</body>
</html>
